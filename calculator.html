<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Web Calculator</title>
    <style>
        /* CSS for Styling */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            font-family: Arial, sans-serif;
            margin: 0;
        }
        .calculator {
            background-color: #22252d;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 300px;
        }
        #display {
            width: 100%;
            height: 60px;
            background-color: #2a2d36;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 2rem;
            text-align: right;
            padding: 10px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        button {
            padding: 20px;
            font-size: 1.25rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background-color: #272b33;
            color: #26e6bb;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2e343f;
        }
        button.operator {
            color: #ff5b5b;
        }
        button.clear {
            color: #f7bb3d;
        }
        button.equal {
            background-color: #26e6bb;
            color: #22252d;
            grid-column: span 2;
        }
        button.equal:hover {
            background-color: #1fc49e;
        }
    </style>
</head>
<body>

    <!-- HTML Layout -->
    <div class="calculator">
        <input type="text" id="display" readonly>
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button class="operator" onclick="appendValue('/')">/</button>
            <button class="operator" onclick="appendValue('*')">*</button>
            <button class="operator" onclick="appendValue('-')">-</button>
            
            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('+')">+</button>
            
            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="appendValue('.')">.</button>
            
            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="appendValue('0')">0</button>
            
            <button class="equal" onclick="calculateResult()">=</button>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const display = document.getElementById('display');

        // Adds numbers or operators to the screen
        function appendValue(input) {
            display.value += input;
        }

        // Clears the screen completely
        function clearDisplay() 
{
            display.value = '';
        }

        // Evaluates the math string using built-in JS math logic
        function calculateResult() {
            try {
                display.value = eval(display.value);
            } catch (error) {
                display.value = 'Error';
            }
        }
    </script>
</body>
</html>
